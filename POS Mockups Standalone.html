    // its OWN frames — from local text at the root, or text obtained from

    // document mints the blobs for its OWN frames, obtaining page text

    // opaque contexts — file:// — everything serializes as 'null', where

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document

      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        if (ownFrameWindows().indexOf(e.source) < 0) return;

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.

    // consumers read these Blobs directly. Survives the swap like the error sink.

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

    }

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);

    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

er',sans-serif;color:#16181c\">$153<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid rgba(0,0,0,.07);border-radius:10px;padding:16px 18px\">\n            <div style=\"font:500 11.5px/1 'Inter',sans-serif;color:rgba(0,0,0,.45);margin-bottom:8px\">Tips<\u002Fdiv>\n            <div style=\"font:700 26px/1 'Inter',sans-serif;color:#16181c\">$210<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:20px\">\n          <div style=\"flex:1;background:#fff;border:1px solid rgba(0,0,0,.07);border-radius:10px;padding:20px\">\n            <div style=\"font:700 15px/1 'Inter',sans-serif;color:#16181c;margin-bottom:16px\">Revenue — Last 7 Days<\u002Fdiv>\n            <div style=\"display:flex;align-items:flex-end;gap:16px;height:140px\">\n              <sc-for list=\"{{ revBars }}\" as=\"b\" hint-placeholder-count=\"7\">\n                <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%\">\n                  <div style=\"{{ b.barStyle }}\"><\u002Fdiv>\n                  <span style=\"font:500 10px/1 'Inter',sans-serif;color:rgba(0,0,0,.5)\">{{ b.day }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:300px;flex:none;background:#fff;border:1px solid rgba(0,0,0,.07);border-radius:10px;padding:20px\">\n            <div style=\"font:700 15px/1 'Inter',sans-serif;color:#16181c;margin-bottom:16px\">Payment Methods<\u002Fdiv>\n            <div style=\"display:flex;height:14px;border-radius:8px;overflow:hidden;margin-bottom:14px\">\n              <div style=\"width:68%;background:#2c6a9e\"><\u002Fdiv>\n              <div style=\"width:22%;background:#7bb2d9\"><\u002Fdiv>\n              <div style=\"width:10%;background:#dce9f3\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <div style=\"display:flex;justify-content:space-between;font:500 13px/1 'Inter',sans-serif;color:#16181c\"><span>Card<\u002Fspan><span>68%<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;font:500 13px/1 'Inter',sans-serif;color:#16181c\"><span>Cash<\u002Fspan><span>22%<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;font:500 13px/1 'Inter',sans-serif;color:#16181c\"><span>Other<\u002Fspan><span>10%<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    view: 'queue',\n    cart: [{ id: 'full', qty: 1 }, { id: 'ceramic', qty: 1 }],\n    paymentMethod: 'card',\n    paymentComplete: false,\n    txnId: null,\n  };\n\n  catalog = [\n    { id: 'wash', name: 'Wash & Wax', category: 'Exterior', price: 45 },\n    { id: 'interior', name: 'Interior Detail', category: 'Interior', price: 85 },\n    { id: 'full', name: 'Full Interior + Exterior Detail', category: 'Full Package', price: 150 },\n    { id: 'paint', name: 'Paint Correction', category: 'Exterior', price: 220 },\n    { id: 'ceramic', name: 'Ceramic Coating', category: 'Protection', price: 650 },\n    { id: 'engine', name: 'Engine Bay Cleaning', category: 'Add-on', price: 35 },\n    { id: 'headlight', name: 'Headlight Restoration', category: 'Add-on', price: 60 },\n    { id: 'petHair', name: 'Pet Hair Removal', category: 'Add-on', price: 40 },\n  ];\n\n  addToCart(id) {\n    this.setState(s => {\n      const existing = s.cart.find(c => c.id === id);\n      if (existing) return { cart: s.cart.map(c => c.id === id ? { ...c, qty: c.qty + 1 } : c) };\n      return { cart: [...s.cart, { id, qty: 1 }] };\n    });\n  }\n  removeFromCart(id) {\n    this.setState(s => ({ cart: s.cart.filter(c => c.id !== id) }));\n  }\n  completePayment() {\n    const txnId = 'TXN-' + Math.floor(1000 + Math.random() * 9000);\n    this.setState({ paymentComplete: true, txnId });\n  }\n  newTransaction() {\n    this.setState({ cart: [], paymentComplete: false, txnId: null, paymentMethod: 'card', view: 'checkout' });\n  }\n\n  renderVals() {\n    const v = this.state.view;\n    const find = id => this.catalog.find(c => c.id === id);\n\n    const cartLines = this.state.cart.map(c => {\n      const item = find(c.id);\n      return {\n        id: c.id, name: item.name, qty: c.qty,\n        unitPriceLabel: '$' + item.price.toFixed(0),\n        lineTotalLabel: '$' + (item.price * c.qty).toFixed(2),\n        lineTotal: item.price * c.qty,\n        remove: () => this.removeFromCart(c.id),\n      };\n    });\n    const subtotal = cartLines.reduce((s, l) => s + l.lineTotal, 0);\n    const tax = subtotal * 0.0825;\n    const total = subtotal + tax;\n\n    const catalogItems = this.catalog.map(c => ({\n      ...c, priceLabel: '$' + c.price.toFixed(0), add: () => this.addToCart(c.id),\n    }));\n\n    const navDefs = [\n      { key: 'queue', label: 'Job Queue' },\n      { key: 'checkout', label: 'Checkout' },\n      { key: 'catalog', label: 'Catalog' },\n      { key: 'payments', label: 'Payments' },\n      { key: 'reports', label: 'Reports' },\n    ];\n    const navItems = navDefs.map(n => {\n      const active = n.key === v;\n      return {\n        label: n.label,\n        onClick: () => this.setState({ view: n.key }),\n        rowStyle: { display: 'flex', alignItems: 'center', gap: 10, padding: '9px 12px', background: active ? '#2c6a9e' : 'transparent', borderRadius: 8, cursor: 'pointer' },\n        dotStyle: { width: 8, height: 8, borderRadius: 2, background: active ? '#fff' : 'rgba(0,0,0,.25)' },\n        textStyle: { font: (active ? '600' : '500') + \" 13px 'Inter',sans-serif\", color: active ? '#fff' : 'rgba(0,0,0,.6)' },\n      };\n    });\n\n    const statusStyles = {\n      'In Progress': { display: 'inline-flex', width: 'fit-content', background: '#dce9f3', color: '#1f4e73', font: \"600 10.5px/1 'Inter',sans-serif\", padding: '5px 10px', borderRadius: 20 },\n      'Waiting': { display: 'inline-flex', width: 'fit-content', background: '#eef0f2', color: '#5b616b', font: \"600 10.5px/1 'Inter',sans-serif\", padding: '5px 10px', borderRadius: 20 },\n      'Ready': { display: 'inline-flex', width: 'fit-content', background: '#e3f3e8', color: '#276b45', font: \"600 10.5px/1 'Inter',sans-serif\", padding: '5px 10px', borderRadius: 20 },\n    };\n    const goCheckout = () => this.setState({ view: 'checkout' });\n    const queueRows = [\n      { vehicle: 'Toyota Camry', service: 'Full Interior + Exterior Detail', status: 'In Progress', bay: 'Bay 2 · Mike', eta: '1:45 PM' },\n      { vehicle: 'Ford F-150', service: 'Ceramic Coating', status: 'Waiting', bay: '—', eta: 'Sched 2:30 PM' },\n      { vehicle: 'Tesla Model 3', service: 'Wash & Wax', status: 'Ready', bay: 'Bay 1 · Alex', eta: 'Done 12:50' },\n      { vehicle: 'Honda Civic', service: 'Paint Correction', status: 'In Progress', bay: 'Bay 3 · Jordan', eta: '3:15 PM' },\n      { vehicle: 'BMW X5', service: 'Interior Detail', status: 'Waiting', bay: '—', eta: 'Sched 3:30 PM' },\n    ].map(r => ({ ...r, statusStyle: statusStyles[r.status], openCheckout: goCheckout }));\n\n    const last7 = [\n      { day: 'Sat', rev: 1120 }, { day: 'Sun', rev: 640 }, { day: 'Mon', rev: 1380 },\n      { day: 'Tue', rev: 1210 }, { day: 'Wed', rev: 1560 }, { day: 'Thu', rev: 1690 }, { day: 'Fri', rev: 1840 },\n    ];\n    const maxRev = Math.max(...last7.map(d => d.rev));\n    const revBars = last7.map(d => ({\n      day: d.day,\n      barStyle: { height: Math.round(d.rev / maxRev * 120) + 'px', background: d.day === 'Fri' ? '#2c6a9e' : '#c9d8e6', borderRadius: '4px 4px 0 0', width: '30px' },\n    }));\n\n    const paymentMethods = [{ key: 'card', label: 'Card' }, { key: 'cash', label: 'Cash' }, { key: 'other', label: 'Other' }].map(m => {\n      const active = this.state.paymentMethod === m.key;\n      return {\n        label: m.label,\n        onClick: () => this.setState({ paymentMethod: m.key }),\n        chipStyle: { padding: '10px 22px', borderRadius: 8, border: active ? '2px solid #2c6a9e' : '1px solid rgba(0,0,0,.15)', background: active ? '#dce9f3' : '#fff', color: active ? '#1f4e73' : '#16181c', fontWeight: 600, fontSize: 13, cursor: 'pointer' },\n      };\n    });\n\n    return {\n      navItems,\n      isQueue: v === 'queue', isCheckout: v === 'checkout', isCatalog: v === 'catalog', isPayments: v === 'payments', isReports: v === 'reports',\n      queueRows,\n      catalogItems,\n      cartLines, cartEmpty: cartLines.length === 0,\n      subtotalLabel: '$' + subtotal.toFixed(2), taxLabel: '$' + tax.toFixed(2), totalLabel: '$' + total.toFixed(2),\n      goPayments: () => this.setState({ view: 'payments' }),\n      paymentMethods,\n      paymentComplete: this.state.paymentComplete, notPaymentComplete: !this.state.paymentComplete,\n      txnId: this.state.txnId,\n      completePayment: () => this.completePayment(),\n      newTransaction: () => this.newTransaction(),\n      revBars,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
